<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Simple budgeting made easy.</p>
    </header>

    <main>
        <section class="budget-card">
            <h2>My Budget</h2>
            <p>Track your budget and expenses using JavaScript.</p>

            <button id="startButton">Enter Budget Information</button>

            <div class="results">
                <h3>Budget Summary</h3>
                <p id="budgetDisplay">Budget: Not entered</p>
                <p id="expenseDisplay">Expenses: Not entered</p>
                <p id="balanceDisplay">Remaining Balance: Not calculated</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpendWise</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
